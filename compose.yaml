services:
    db:
        image: postgres:16
        container_name: poe-tracker-postgres

        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}

        volumes:
           - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        
        restart: unless stopped

    pgadmin:
        image: dpage/pgadmin4:9.15

        profiles:
            - tools

        environment: 
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
            PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'

        ports:
            - '127.0.0.1:5050:80'
        
        depends_on:
            db:
                condition: service_healthy

    fetcher:
        build: .
        container_name: poe-tracker-fetcher

        depends_on:
            db:
                condition: service_healthy

        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            POE_GAMES: ${POE_GAMES}
            FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES}

        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.0.1-security-01
        container_name: poe-tracker-grafana

        ports:
            - '127.0.0.1:4000:3000'

        environment:
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}

            GF_SERVER_ROOT_URL: https://178.105.59.4/poe/
            GF_SERVER_SERVE_FROM_SUB_PATH: "true"

        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

        depends_on:
            db:
                condition: service_healthy
        
        restart: unless stopped

volumes:
    postgres_data:
    grafana-data:
    pgadmin-data: